services:
  plex:
    image: linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - VERSION=docker
    volumes:
      - /mnt/user/appdata/plex:/config
      - /mnt/user/media/tv:/tv
      - /mnt/user/media/movies:/movies
    restart: unless-stopped
