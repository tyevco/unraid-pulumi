services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80/tcp"
    environment:
      - TZ=${TZ}
      - WEBPASSWORD=${WEBPASSWORD}
    volumes:
      - /mnt/user/appdata/pihole/etc:/etc/pihole
      - /mnt/user/appdata/pihole/dnsmasq:/etc/dnsmasq.d
    restart: unless-stopped
